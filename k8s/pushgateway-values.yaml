fullnameOverride: ai-bluegreen-pushgateway

replicaCount: 1

service:
  type: ClusterIP
  port: 9091
  targetPort: 9091
  portName: http

serviceMonitor:
  enabled: true
  namespace: monitoring
  interval: 5s
  honorLabels: true
  additionalLabels:
    release: monitoring

resources:
  requests:
    cpu: 25m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi
